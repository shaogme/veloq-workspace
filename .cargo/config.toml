xcheck-windows = "run --package xtest-runner -- --task check --target windows --quiet"
xclippy-linux-x86_64-gnu = "run --package xtest-runner -- --task clippy --target linux --linux-target x86_64-unknown-linux-gnu --package veloq-futex,veloq-std,veloq-runtime --quiet"
