[package]
name = "veloq-std"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Veloq std implementation."
readme.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
hashbrown = { version = "0.17.1", default-features = false, features = ["alloc"] }
lock_api = { version = "0.4.14", default-features = false }
veloq-hash.workspace = true
veloq-tls.workspace = true
crossbeam-utils.workspace = true
crossbeam-queue.workspace = true

[dependencies.loom]
workspace = true
features = ["futures"]
optional = true

[features]
default = ["std"]
std = []
loom = ["std", "dep:loom", "veloq-tls/loom"]

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc.workspace = true
veloq-futex.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_Security",
] }

[dev-dependencies]
trybuild = "1.0"
